<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter API 测试</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      color: #667eea;
      text-align: center;
      margin-bottom: 30px;
    }
    .test-section {
      margin: 20px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      min-height: 100px;
    }
    .success {
      color: #28a745;
      font-weight: 600;
    }
    .error {
      color: #dc3545;
      font-weight: 600;
    }
    .loading {
      color: #667eea;
      font-weight: 600;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
    }
    .info {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .info h3 {
      margin-top: 0;
      color: #2196F3;
    }
    .chat-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 10px;
      box-sizing: border-box;
    }
    .chat-input:focus {
      outline: none;
      border-color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 OpenRouter API 测试工具</h1>
    
    <div class="info">
      <h3>📝 配置信息</h3>
      <p><strong>API端点:</strong> https://openrouter.ai/api/v1/chat/completions</p>
      <p><strong>模型:</strong> alibaba/tongyi-deepresearch-30b-a3b:free</p>
      <p><strong>状态:</strong> <span id="apiStatus">检测中...</span></p>
    </div>

    <div class="test-section">
      <h3>🧪 快速测试</h3>
      <p>点击按钮测试API连接和基本功能</p>
      <button id="quickTestBtn" onclick="quickTest()">快速测试</button>
    </div>

    <div class="test-section">
      <h3>💬 自定义对话测试</h3>
      <p>输入你的消息，测试AI回复</p>
      <input 
        type="text" 
        id="userMessage" 
        class="chat-input" 
        placeholder="输入你的消息..."
        onkeypress="if(event.key==='Enter') customTest()"
      >
      <button id="customTestBtn" onclick="customTest()">发送消息</button>
    </div>

    <div class="test-section">
      <h3>🔍 完整API响应测试</h3>
      <p>查看完整的API响应数据（JSON格式）</p>
      <button id="fullTestBtn" onclick="fullTest()">查看完整响应</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    const API_KEY = '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';
    const MODEL = 'alibaba/tongyi-deepresearch-30b-a3b:free';
    const API_URL = 'https://openrouter.ai/api/v1/chat/completions';

    // 检查API状态
    async function checkAPIStatus() {
      const statusEl = document.getElementById('apiStatus');
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [{ role: 'user', content: 'ping' }],
            max_tokens: 10
          })
        });
        
        if (response.ok) {
          statusEl.innerHTML = '<span class="success">✅ API可用</span>';
        } else {
          statusEl.innerHTML = '<span class="error">❌ API不可用</span>';
        }
      } catch (error) {
        statusEl.innerHTML = '<span class="error">❌ 连接失败</span>';
      }
    }

    // 快速测试
    async function quickTest() {
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('quickTestBtn');
      
      btn.disabled = true;
      resultDiv.innerHTML = '<div class="loading">⏳ 正在测试API连接...</div>';
      
      try {
        const startTime = Date.now();
        
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              {
                role: 'system',
                content: '你是一个友好的AI助手，请用简洁的中文回答问题。'
              },
              {
                role: 'user',
                content: '你好，请用一句话介绍你自己。'
              }
            ],
            max_tokens: 100,
            temperature: 0.7
          })
        });
        
        const endTime = Date.now();
        const duration = ((endTime - startTime) / 1000).toFixed(2);
        
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(`API错误: ${response.status} - ${errorData.error?.message || '未知错误'}`);
        }
        
        const data = await response.json();
        const aiReply = data.choices[0].message.content;
        
        resultDiv.innerHTML = `
          <div class="success">✅ 测试成功!</div>
          <h3>AI回复:</h3>
          <div style="background: #f0f8ff; padding: 15px; border-radius: 6px; margin: 10px 0;">
            ${aiReply}
          </div>
          <p><strong>响应时间:</strong> ${duration}秒</p>
          <p><strong>使用模型:</strong> ${data.model}</p>
          <p><strong>Token使用:</strong> ${data.usage?.total_tokens || 'N/A'}</p>
        `;
      } catch (error) {
        console.error('测试失败:', error);
        resultDiv.innerHTML = `
          <div class="error">❌ 测试失败</div>
          <p>${error.message}</p>
          <p>请检查:</p>
          <ul>
            <li>API密钥是否正确</li>
            <li>网络连接是否正常</li>
            <li>模型名称是否正确</li>
          </ul>
        `;
      } finally {
        btn.disabled = false;
      }
    }

    // 自定义对话测试
    async function customTest() {
      const userMessage = document.getElementById('userMessage').value.trim();
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('customTestBtn');
      
      if (!userMessage) {
        alert('请输入消息');
        return;
      }
      
      btn.disabled = true;
      resultDiv.innerHTML = `
        <div class="loading">⏳ AI正在思考...</div>
        <p><strong>你的消息:</strong> ${userMessage}</p>
      `;
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              {
                role: 'system',
                content: '你是一个友好、有帮助的AI助手。请用中文回答问题，回答要清晰、准确、有深度。'
              },
              {
                role: 'user',
                content: userMessage
              }
            ],
            max_tokens: 500,
            temperature: 0.7
          })
        });
        
        if (!response.ok) {
          throw new Error(`API错误: ${response.status}`);
        }
        
        const data = await response.json();
        const aiReply = data.choices[0].message.content;
        
        resultDiv.innerHTML = `
          <div class="success">✅ 对话成功!</div>
          <div style="margin: 15px 0;">
            <strong>👤 你说:</strong>
            <div style="background: #e3f2fd; padding: 10px; border-radius: 6px; margin: 5px 0;">
              ${userMessage}
            </div>
          </div>
          <div style="margin: 15px 0;">
            <strong>🤖 AI回复:</strong>
            <div style="background: #f0f8ff; padding: 10px; border-radius: 6px; margin: 5px 0;">
              ${aiReply}
            </div>
          </div>
        `;
        
        // 清空输入框
        document.getElementById('userMessage').value = '';
      } catch (error) {
        console.error('对话失败:', error);
        resultDiv.innerHTML = `
          <div class="error">❌ 对话失败</div>
          <p>${error.message}</p>
        `;
      } finally {
        btn.disabled = false;
      }
    }

    // 完整响应测试
    async function fullTest() {
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('fullTestBtn');
      
      btn.disabled = true;
      resultDiv.innerHTML = '<div class="loading">⏳ 获取完整响应...</div>';
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: 'user', content: '简单介绍一下DeepTalk项目' }
            ],
            max_tokens: 200,
            temperature: 0.7
          })
        });
        
        const data = await response.json();
        
        resultDiv.innerHTML = `
          <div class="success">✅ 获取成功!</div>
          <h3>完整API响应:</h3>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        console.error('获取失败:', error);
        resultDiv.innerHTML = `
          <div class="error">❌ 获取失败</div>
          <p>${error.message}</p>
        `;
      } finally {
        btn.disabled = false;
      }
    }

    // 页面加载时检查API状态
    checkAPIStatus();
  </script>
</body>
</html>
